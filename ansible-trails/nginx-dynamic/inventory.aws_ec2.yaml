plugin: amazon.aws.aws_ec2
region: us-east-1
keyed_groups:
  - key: tags.name
    prefix: "dynamic"
    seperator: "-"
filters:
  tag:Name: frontend
  instance-state-name: running
hostnames:
  # You can also specify a list in order of precedence for hostname variables. basically inventory
  - private-ip-address
compose:
  # This sets the `ansible_host` variable to connect with the private IP address without changing the hostname. telling ansible by ssh which ip we need to connect
  ansible_host: private_ip_address