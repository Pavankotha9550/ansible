- name: disabling nginx
  ansible.builtin.command: dnf module disable ngin -y
  ignore_errors: true

- name: enabling nginx
  ansible.builtin.command: dnf module enable nginx:1.24 -y
  ignore_errors: true

- name: installing nginx
  ansible.builtin.package:
    name: nginx
    state: present
  ignore_errors: true

- name: start and enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
  ignore_errors: true