- name: ec2 and route 53
  hosts: local
  connection: local
  vars:
    instances:
      - frontend
      - mysql
      - backend
    subnet: "subnet-06631d9dd130f6ebc"
    sg: "sg-0ccfe8392d60403ed"
    image: "ami-0220d79f3f480ecf5"
    zone: "daws84.cyou"

  tasks:
    - name: creating instances
      amazon.aws.ec2_instance:
        name: "{{item}}"
        vpc_subnet_id: "{{subnet}}"
        instance_type: t3.micro
        security_group: "{{sg}}"
        image_id: "{{image}}"
        tags:
          Environment: "{{item}}"
      loop: "{{instances}}"
      register: ec2_output

    - name: printing output
      ansible.builtin.debug:
        msg: "{{ec2_output}}"

    - name: creating route53
      amazon.aws.route53:
        state: present
        zone: "{{zone}}"
        record: "{{item.item}}.{{zone}}"
        type: A
        ttl: 1
        value: "{{item.instance[0].private_ip_address}}"
        wait: true
        overwrite: true
      loop: "{{ec2_output.result}}"


    - name: creating route53 for frontend
      amazon.aws.route53:
        state: present
        zone: "{{zone}}"
        record: "{{item.item}}.{{zone}}"
        type: A
        ttl: 1
        value: "{{item.instance[0].private_ip_address}}"
        wait: true
        overwrite: true
      loop: "{{ec2_output.results}}"
      when: item.item == "frontend"

